name: is-risk-classifier

# Images pinned by tag and digest (M-02). Only web, Keycloak and Mailpit are published, on
# loopback only.

x-app-env: &app-env
  # Any UID may run the containers (see user below); HOME must be writable for caches
  HOME: /tmp
  DATABASE_HOST: db
  OIDC_PUBLIC_BASE_URL: http://localhost:8080
  OIDC_INTERNAL_BASE_URL: http://keycloak:8080

# Web and worker connect with the restricted role from setup_db_roles (INV-03, M-06)
x-app-role-env: &app-role-env
  <<: *app-env
  DATABASE_USER: ${POSTGRES_APP_USER}
  DATABASE_PASSWORD: ${POSTGRES_APP_PASSWORD}

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: dev
  image: is-risk-classifier:dev
  env_file: .env
  environment: *app-env
  # The source is bind-mounted: run as the owner of the working tree (make passes the IDs),
  # so caches, SBOM and catalogues can be written also where that is not UID 1000 (CI)
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  volumes:
    - ./:/app

services:
  db:
    image: postgres:17-trixie@sha256:ae69c452f483507a6b99fb654cf93aad7fe156ffd2c56247707eef4e36d3c12b
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Browser-facing URL; the app talks to Keycloak over the internal network (backchannel)
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Placeholders in the realm file are resolved from these variables on import
      OIDC_RP_CLIENT_SECRET: ${OIDC_RP_CLIENT_SECRET}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
    volumes:
      - ./docker/keycloak/realm-is-risk.json:/opt/keycloak/data/import/realm-is-risk.json:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8080:8080"
    networks: [frontend]
    healthcheck:
      # The image ships without curl; talk HTTP to the management port directly
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Tailwind in watch mode: rebuilds src/static/css/build/app.css when templates change
  css:
    <<: *app
    command:
      - tailwindcss
      - --input=src/assets/app.css
      - --output=src/static/css/build/app.css
      - --watch=always
    network_mode: none
    healthcheck:
      test: ["CMD-SHELL", "test -s src/static/css/build/app.css"]
      interval: 5s
      timeout: 3s
      retries: 24

  # One-shot as database owner: schema, restricted application role, CMDB sample data
  migrate:
    <<: *app
    command: >-
      sh -c "python src/manage.py migrate --noinput &&
             python src/manage.py setup_db_roles &&
             python src/manage.py import_assets src/apps/cmdb/data/assets.csv"
    networks: [backend]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    environment: *app-role-env
    command: ["python", "src/manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "127.0.0.1:8000:8000"
    networks: [frontend, backend, pdf]
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      css:
        condition: service_healthy
      pdf-renderer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Outbox worker: delivers queued notifications (mock gateway until iteration 6)
  worker:
    <<: *app
    environment:
      <<: *app-role-env
      NOTIFICATION_GATEWAY: apps.notifications.gateway.HttpGateway
    command: ["python", "src/manage.py", "run_outbox"]
    networks: [backend, notify]
    depends_on:
      web:
        condition: service_healthy
      notify-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/outbox-heartbeat -mmin -1 | grep -q ."]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  # M-03: PDF generation in its own process. No env_file, no database network, no credentials;
  # read-only file system, no capabilities. Reachable only from web over the internal network.
  pdf-renderer:
    image: is-risk-classifier:dev
    command: ["python", "-m", "pdf_renderer.server"]
    environment:
      PDF_RENDERER_PORT: "8001"
      HOME: /tmp
    volumes:
      - ./src:/app/src:ro
    networks: [pdf]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      css:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Stand-in for the external e-mail/SMS provider: e-mail to Mailpit, SMS to the log.
  # NOTIFY_FAILURE_MODE=timeout|5xx in .env forces the outage of AK-03.3 (then:
  # docker compose up -d notify-gateway). Like pdf-renderer: no env_file, no database network.
  notify-gateway:
    image: is-risk-classifier:dev
    command: ["python", "-m", "notify_gateway.server"]
    environment:
      NOTIFY_GATEWAY_TOKEN: ${NOTIFY_GATEWAY_TOKEN}
      NOTIFY_FAILURE_MODE: ${NOTIFY_FAILURE_MODE:-none}
      NOTIFY_GATEWAY_PORT: "8002"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: eskalation@is-risk.example
      HOME: /tmp
    volumes:
      - ./src:/app/src:ro
    networks: [notify]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Mail sink with web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:8025:8025"
    networks: [frontend, notify]

  # Test runner: real PostgreSQL, no Keycloak (tests log in directly)
  test:
    <<: *app
    profiles: [tools]
    command: ["pytest"]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy

  # Lint, format, type check, lockfile — no database (uv lock needs the internet)
  tools:
    <<: *app
    profiles: [tools]
    command: ["true"]
    networks: [frontend]

volumes:
  db-data:
  keycloak-data:

networks:
  frontend:
  # No route to the outside world for the database network
  backend:
    internal: true
  # Only web and pdf-renderer; no route outside, no database (M-03)
  pdf:
    internal: true
  # Worker, notify-gateway and Mailpit
  notify:
    internal: true
