# Checks on every push and pull request, and once a week so that newly published
# vulnerabilities in pinned dependencies show up without a code change (M-02).
# Everything runs in the same containers as locally (make targets); actions pinned by commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tests, traceability
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Create .env with random secrets
        run: make .env

      - name: Lint (ruff, mypy)
        run: make lint

      - name: Tests (PostgreSQL in Docker)
        run: make test

      - name: Traceability table is up to date
        run: |
          make trace
          git diff --exit-code docs/traceability.md

  supply-chain:
    name: Vulnerability audit and SBOM (M-02)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Create .env with random secrets
        run: make .env

      - name: Audit runtime dependencies (pip-audit)
        run: make audit

      - name: Generate SBOM (CycloneDX 1.5)
        if: always()
        run: make sbom

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom/is-risk-classifier.cdx.json
          if-no-files-found: error
          retention-days: 90
